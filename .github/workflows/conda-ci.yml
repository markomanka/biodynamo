name: Conda CI

# Builds and tests BioDynaMo with every dependency taken from conda-forge
# (environment.yml): no Homebrew, no pyenv, no prebuilt bundles.

on:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - name: Checkout BioDynaMo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Create the conda-forge environment
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        init-shell: bash
        cache-environment: true
        post-cleanup: 'all'

    # Diagnostic, to be removed: does ROOT's interpreter itself handle these
    # headers in this environment, without BioDynaMo?
    - name: Interpreter checks (diagnostic)
      continue-on-error: true
      run: |
        for h in '<stdint.h>' '<omp.h>'; do
          echo "--- root: #include $h"
          root -l -b -q -e "#include $h" 2>&1 | tail -25
          echo "exit: ${PIPESTATUS[0]}"
        done

    - name: Build BioDynaMo
      run: |
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -Dparaview=ON \
          -Dbenchmark=ON
        grep -q '^BDM_SYSTEM_DEPENDENCIES:BOOL=ON' build/CMakeCache.txt
        for d in root paraview qt; do
          if [ -d "build/third_party/$d" ]; then
            echo "::error::$d was downloaded although it should come from conda-forge"
            exit 1
          fi
        done
        cmake --build build --parallel

    # Diagnostic, to be removed: do the checkpoint tests crash when they run
    # alone, without the tests that run before them in the full suite?
    - name: Checkpoint tests alone (diagnostic)
      if: runner.os == 'Linux'
      continue-on-error: true
      working-directory: build
      run: |
        . bin/thisbdm.sh
        bdm config
        ninja biodynamo-unit-tests
        set +e
        bin/biodynamo-unit-tests --gtest_filter='IOTest.*' > iotest-alone.log 2>&1
        echo "IOTest alone: exit $?"
        grep -E '^\[ *(RUN|OK|FAILED|PASSED) *\]|\*\*\* Break' iotest-alone.log | tail -30

    - name: Unit tests BioDynaMo
      working-directory: build
      run: |
        . bin/thisbdm.sh
        bdm config
        ninja run-unit-tests

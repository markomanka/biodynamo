name: Conda CI

# Builds and tests BioDynaMo with every dependency taken from conda-forge
# (environment.yml): no Homebrew, no pyenv, no prebuilt bundles.

on:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            paraview: 'ON'
          # conda-forge's ParaView 6.2.0 for Apple Silicon links libvtkcgns, which
          # its VTK package does not ship, so programs loading ParaView cannot
          # start (INSTALL.md, "Known issues").
          - os: macos-15
            paraview: 'OFF'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - name: Checkout BioDynaMo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Create the conda-forge environment
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        init-shell: bash
        cache-environment: true
        post-cleanup: 'all'

    - name: Build BioDynaMo
      run: |
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -Dparaview=${{ matrix.paraview }} \
          -Dbenchmark=ON
        grep -q '^BDM_SYSTEM_DEPENDENCIES:BOOL=ON' build/CMakeCache.txt
        for d in root paraview qt; do
          if [ -d "build/third_party/$d" ]; then
            echo "::error::$d was downloaded although it should come from conda-forge"
            exit 1
          fi
        done
        cmake --build build --parallel

    - name: Unit tests BioDynaMo
      working-directory: build
      run: |
        . bin/thisbdm.sh
        bdm config
        ninja run-unit-tests

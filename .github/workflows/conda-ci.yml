name: Conda CI

# Builds and tests BioDynaMo with every dependency taken from conda-forge
# (environment.yml): no Homebrew, no pyenv, no prebuilt bundles.

on:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - name: Checkout BioDynaMo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Create the conda-forge environment
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        init-shell: bash
        cache-environment: true
        post-cleanup: 'all'

    # Diagnostic, to be removed: does ROOT's interpreter itself handle these
    # headers in this environment, without BioDynaMo?
    - name: Interpreter checks (diagnostic)
      continue-on-error: true
      run: |
        for h in '<stdint.h>' '<omp.h>'; do
          echo "--- root: #include $h"
          root -l -b -q -e "#include $h" 2>&1 | tail -25
          echo "exit: ${PIPESTATUS[0]}"
        done

    - name: Build BioDynaMo
      run: |
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -Dparaview=ON \
          -Dbenchmark=ON
        grep -q '^BDM_SYSTEM_DEPENDENCIES:BOOL=ON' build/CMakeCache.txt
        for d in root paraview qt; do
          if [ -d "build/third_party/$d" ]; then
            echo "::error::$d was downloaded although it should come from conda-forge"
            exit 1
          fi
        done
        cmake --build build --parallel

    # Diagnostic, to be removed: the whole Linux suite, excluding each test that
    # crashes the program and running again, so one run lists every failure.
    - name: Linux suite without the crashing tests (diagnostic)
      if: runner.os == 'Linux'
      continue-on-error: true
      working-directory: build
      run: |
        . bin/thisbdm.sh
        bdm config
        ninja biodynamo-unit-tests
        set +e
        exclude="IOTest.AgentUidGenerator"
        for pass in 1 2 3 4 5 6 7 8; do
          timeout 1800 bin/biodynamo-unit-tests --gtest_filter="-$exclude" > "suite-$pass.log" 2>&1
          echo "=== pass $pass: exit $?, excluding $exclude"
          grep -E '^\[==========\] [0-9]+ tests? from [0-9]+ test suites? ran|^\[  PASSED  \] [0-9]+|FAILED TESTS?$' "suite-$pass.log"
          grep -oE '^\[  FAILED  \] [A-Za-z0-9_]+\.[A-Za-z0-9_/]+' "suite-$pass.log" | sort -u
          if grep -qE '^\[==========\] [0-9]+ tests? from [0-9]+ test suites? ran' "suite-$pass.log"; then
            echo "=== the suite ran to the end"
            break
          fi
          crashed=$(grep -E '^\[ RUN      \]' "suite-$pass.log" | tail -1 | awk '{print $NF}')
          [ -n "$crashed" ] || { echo "=== crashed outside a test; stopping"; tail -20 "suite-$pass.log"; break; }
          echo "=== crashed in: $crashed"
          grep -A60 -m1 -E '^ *\*\*\* Break' "suite-$pass.log" | grep ' in ' | grep -v libCling | cut -c1-220 | head -10
          exclude="$exclude:$crashed"
        done

    - name: Unit tests BioDynaMo
      working-directory: build
      run: |
        . bin/thisbdm.sh
        bdm config
        ninja run-unit-tests

name: Conda CI

# Builds and tests BioDynaMo with every dependency taken from conda-forge
# (environment.yml): no Homebrew, no pyenv, no prebuilt bundles.

on:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - name: Checkout BioDynaMo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Create the conda-forge environment
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        init-shell: bash
        cache-environment: true
        post-cleanup: 'all'

    # The ParaView tests render through X, as in upstream's Ubuntu CI; the
    # macOS runner has a display of its own.
    - name: Start Xvfb
      if: runner.os == 'Linux'
      run: |
        set -e
        sudo apt-get -y install xvfb
        XVFBARGS=":99 -ac -screen 0 2560x1440x24"
        /usr/bin/Xvfb $XVFBARGS >> /tmp/Xvfb.out 2>&1 &
        disown -ar
        sleep 3

    # BioDynaMo must build from the environment alone (issue #13): until the
    # build ends, the build user reaches only the loopback interface, which
    # MPI uses. A download attempt would fail the build.
    # BioDynaMo must build from the environment alone (issue #13). On Linux the
    # configure and build run in their own network namespace, where only the
    # loopback interface is up, so a download attempt fails while the runner's
    # own connection, outside the namespace, is untouched.
    - name: Build BioDynaMo
      run: |
        cat > "$RUNNER_TEMP/build.sh" <<'SCRIPT'
        set -euo pipefail
        cmake -G Ninja -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -Dparaview=ON \
          -Dbenchmark=ON
        grep -q '^BDM_SYSTEM_DEPENDENCIES:BOOL=ON' build/CMakeCache.txt
        for d in root paraview qt; do
          if [ -d "build/third_party/$d" ]; then
            echo "::error::$d was downloaded although it should come from conda-forge"
            exit 1
          fi
        done
        cmake --build build --parallel
        SCRIPT
        if [ "$RUNNER_OS" != Linux ]; then
          bash "$RUNNER_TEMP/build.sh"
          exit 0
        fi
        cat > "$RUNNER_TEMP/offline.sh" <<'SCRIPT'
        set -euo pipefail
        ip link set lo up
        exec setpriv --reuid="$BUILD_UID" --regid="$BUILD_GID" --init-groups bash -c '
          if curl -fsS -m 10 -o /dev/null https://github.com 2>/dev/null; then
            echo "::error::the network is reachable inside the namespace"
            exit 1
          fi
          exec bash "$RUNNER_TEMP/build.sh"
        '
        SCRIPT
        sudo --preserve-env env "PATH=$PATH" "BUILD_UID=$(id -u)" "BUILD_GID=$(id -g)" \
          unshare --net bash "$RUNNER_TEMP/offline.sh"

    - name: Unit tests BioDynaMo
      working-directory: build
      run: |
        . bin/thisbdm.sh
        bdm config
        if [ "$RUNNER_OS" = Linux ]; then export DISPLAY=:99.0; fi
        # conda-forge's ROOT 6.40.04 cannot build its module for <stdint.h>
        # with a macOS 15 or newer SDK (INSTALL.md, "Known issues"); a macOS 14
        # SDK, where the runner has one, works.
        if [ "$RUNNER_OS" = macOS ]; then
          sdk14=$(ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX14*.sdk 2>/dev/null | tail -1)
          if [ -n "$sdk14" ]; then export SDKROOT="$sdk14"; echo "ROOT's interpreter uses $SDKROOT"; fi
        fi
        ninja run-unit-tests

    - name: Build and run a project outside BioDynaMo's tree
      run: |
        . build/bin/thisbdm.sh
        cmake -G Ninja -S demo/cell_division -B out-of-tree -DCMAKE_BUILD_TYPE=Release
        cmake --build out-of-tree
        std=$(root-config --cflags | grep -oE -- '-std=(c|gnu)\+\+[0-9]+' | grep -oE '[0-9]+$')
        if ! grep -qE -- "-std=(c|gnu)\+\+${std}( |$)" out-of-tree/build.ninja; then
          echo "::error::the project did not compile with ROOT's C++${std}"
          exit 1
        fi
        if [ "$RUNNER_OS" = macOS ]; then
          sdk14=$(ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX14*.sdk 2>/dev/null | tail -1)
          if [ -n "$sdk14" ]; then export SDKROOT="$sdk14"; fi
        fi
        (cd out-of-tree && ./cell_division)

    # An installation must work on its own (issue #13): install into a prefix,
    # move the build folder away, then run the tests and a project from the
    # installation alone.
    - name: Install BioDynaMo, then test the installation
      run: |
        cmake --install build --prefix "$RUNNER_TEMP/install"
        prefix=$(ls -d "$RUNNER_TEMP"/install/biodynamo-v*)
        echo "installed in $prefix"
        mv build build-moved
        . "$prefix/bin/thisbdm.sh"
        bdm config
        if [ "$RUNNER_OS" = Linux ]; then export DISPLAY=:99.0; fi
        if [ "$RUNNER_OS" = macOS ]; then
          sdk14=$(ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX14*.sdk 2>/dev/null | tail -1)
          if [ -n "$sdk14" ]; then export SDKROOT="$sdk14"; fi
        fi
        (cd "$prefix" && bin/biodynamo-unit-tests)
        cp -r demo/cell_division "$RUNNER_TEMP/cell_division"
        cmake -G Ninja -S "$RUNNER_TEMP/cell_division" -B "$RUNNER_TEMP/cell_division/build" -DCMAKE_BUILD_TYPE=Release
        cmake --build "$RUNNER_TEMP/cell_division/build"
        (cd "$RUNNER_TEMP/cell_division/build" && ./cell_division)
